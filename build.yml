name: Build QuadraVerb Plus VST3

on:
  push:
  workflow_dispatch:

jobs:
  build-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Configure CMake
        run: cmake -B build -DCMAKE_BUILD_TYPE=Release

      - name: Build VST3
        run: cmake --build build --config Release --parallel

      - name: Upload VST3 Artifact
        uses: actions/upload-artifact@v4
        with:
          name: QuadraVerb-Plus-Windows-VST3
          path: build/QuadraVerbPlus_artefacts/Release/VST3/
Use code with caution.
(Note: Adding submodules: recursive under actions/checkout@v4 also ensures JUCE is cloned properly if your repo includes JUCE as a Git submodule).
